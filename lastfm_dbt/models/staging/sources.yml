version: 2

# The raw table only has two columns: RAW_DATA (the whole JSON) and LOADED_AT.
# Tests on track_name / artist_name / chart_position live in stg_top_tracks.yml,
# because those columns only exist after the JSON is flattened.

sources:
  - name: raw
    database: LASTFM
    schema: RAW
    tables:
      - name: top_tracks
        description: "Raw Last.fm top 50 tracks, one row per API call (loaded daily by GitHub Actions)"
        columns:
          - name: raw_data
            description: "Full JSON response from chart.gettoptracks, with chart_position added per track"
            data_tests:
              - not_null
          - name: loaded_at
            description: "Timestamp of the API call, parsed from the file name"
            data_tests:
              - not_null
